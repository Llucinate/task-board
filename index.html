<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6b4a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Доска задач</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:Inter,system-ui,sans-serif;color:#2b2118;background:#b98a57;
  background-image:
    radial-gradient(circle at 20% 30%,rgba(0,0,0,.08) 1px,transparent 1.5px),
    radial-gradient(circle at 70% 60%,rgba(255,255,255,.08) 1px,transparent 1.5px),
    radial-gradient(circle at 40% 80%,rgba(0,0,0,.06) 1px,transparent 1.5px);
  background-size:7px 7px,11px 11px,5px 5px;min-height:100vh;
}
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 24px;padding-top:max(16px,env(safe-area-inset-top));
  background:#6b4a2b;color:#fff3e0;box-shadow:0 3px 10px rgba(0,0,0,.25);
  position:sticky;top:0;z-index:5;
}
h1{font-family:Caveat,cursive;font-size:40px;margin:0;line-height:1}
.count{font-size:14px;opacity:.85;margin-top:2px}
.add-btn{
  font:600 16px Inter,sans-serif;border:0;border-radius:999px;padding:12px 22px;
  background:#ffe066;color:#2b2118;cursor:pointer;box-shadow:0 2px 0 #c9a227;white-space:nowrap;
}
.add-btn:active{transform:translateY(2px);box-shadow:none}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 24px 0;max-width:1400px;margin:0 auto}
.chip{
  font:600 14px Inter,sans-serif;border:0;border-radius:999px;padding:8px 16px;
  background:rgba(255,255,255,.35);color:#2b2118;cursor:pointer;
}
.chip.on{background:#fff3e0}
.status{margin-left:auto;font-size:12px;color:#fff3e0;opacity:.85}
#board{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:30px;padding:26px 24px 100px;max-width:1400px;margin:0 auto;
}
.note{
  position:relative;padding:30px 16px 14px;min-height:190px;display:flex;flex-direction:column;
  box-shadow:0 8px 14px rgba(0,0,0,.28),inset 0 -12px 18px rgba(0,0,0,.04);
  transition:transform .15s;animation:pin .25s ease-out;
}
@keyframes pin{from{opacity:0;transform:translateY(-12px) scale(.96)}}
@media (hover:hover){.note:hover{transform:rotate(0) scale(1.03)!important;z-index:2}}
.note::before{
  content:"";position:absolute;top:9px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ff8a8a,#c0262d);box-shadow:0 3px 4px rgba(0,0,0,.4);
}
.c-yellow{background:#fff27a}.c-pink{background:#ffb3c8}.c-blue{background:#a9dcff}
.c-green{background:#b9f0a4}.c-orange{background:#ffcc85}
.note .title{font-family:Caveat,cursive;font-size:29px;font-weight:700;line-height:1.05;overflow-wrap:anywhere}
.note .desc{font-family:Caveat,cursive;font-size:22px;line-height:1.15;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere;flex:1}
.note .meta{font-size:12px;opacity:.7;margin-top:10px;line-height:1.4}
.note .who{font-weight:600}
.taken{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;background:rgba(0,0,0,.08);padding:4px 8px;border-radius:6px}
.actions{display:flex;gap:6px;margin-top:10px}
.actions button{
  flex:1;font:600 13px Inter,sans-serif;border:0;border-radius:8px;padding:10px 6px;cursor:pointer;
  background:rgba(0,0,0,.08);color:#2b2118;
}
.actions button:hover{background:rgba(0,0,0,.16)}
.actions .rm{background:rgba(192,38,45,.15);color:#8a1218}
.actions .rm:hover{background:rgba(192,38,45,.28)}
.actions button:disabled{opacity:.5}
.empty{grid-column:1/-1;text-align:center;font-family:Caveat,cursive;font-size:32px;color:#fff3e0;padding:60px 10px}
.fab{display:none}

.overlay{position:fixed;inset:0;background:rgba(30,18,8,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay.open{display:flex}
.dialog{background:#fffaf0;border-radius:16px;padding:22px;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.35);max-height:100%;overflow:auto}
.dialog h2{font-family:Caveat,cursive;font-size:34px;margin:0 0 10px}
.dialog label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
.dialog input,.dialog textarea{
  width:100%;font:16px Inter,sans-serif;padding:11px 12px;border:1.5px solid #d9c7ad;border-radius:10px;background:#fff;color:#2b2118;
}
.dialog input:focus,.dialog textarea:focus{outline:none;border-color:#6b4a2b}
.dialog textarea{min-height:90px;resize:vertical}
.colors{display:flex;gap:12px}
.colors button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.colors button.sel{border-color:#2b2118}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;font:600 16px Inter,sans-serif;border:0;border-radius:12px;padding:13px;cursor:pointer}
.primary{background:#2b2118;color:#fff}.secondary{background:#eadfcd;color:#2b2118}.danger{background:#c0262d;color:#fff}
.row button:disabled{opacity:.6}
.err{color:#c0262d;font-size:13px;margin-top:8px;min-height:1em}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#2b2118;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;display:none;z-index:30;max-width:90vw;text-align:center;
}
.toast.show{display:block}

/* Телефон */
@media (max-width:640px){
  header{padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
  h1{font-size:32px}
  .count{font-size:13px}
  header .add-btn{display:none}
  .toolbar{padding:12px 16px 0;flex-wrap:nowrap;overflow-x:auto}
  .status{display:none}
  #board{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;padding:20px 14px 120px}
  .note{min-height:160px;padding:26px 11px 11px}
  .note .title{font-size:24px}
  .note .desc{font-size:19px}
  .actions{flex-direction:column}
  .fab{
    display:block;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:10;
    width:62px;height:62px;border-radius:50%;border:0;background:#ffe066;color:#2b2118;font-size:34px;line-height:1;
    box-shadow:0 6px 16px rgba(0,0,0,.35);cursor:pointer;
  }
  .overlay{align-items:flex-end;padding:0}
  .dialog{max-width:none;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
}
@media (max-width:360px){#board{grid-template-columns:1fr}.actions{flex-direction:row}}
</style>
</head>
<body>
<header>
  <div>
    <h1>📌 Доска задач</h1>
    <div class="count" id="count">Загружаю…</div>
  </div>
  <button class="add-btn" id="addBtn">+ Повесить задачу</button>
</header>
<div class="toolbar">
  <div id="filters" style="display:flex;gap:8px"></div>
  <span class="status" id="status"></span>
</div>
<main id="board"></main>
<button class="fab" id="fab" aria-label="Повесить задачу">+</button>

<div class="overlay" id="addOv">
  <form class="dialog" id="addForm">
    <h2>Новая задача</h2>
    <label for="fTitle">Что нужно сделать</label>
    <input id="fTitle" maxlength="80" placeholder="Например: сделать логотип" autocomplete="off">
    <label for="fDesc">Подробности (необязательно)</label>
    <textarea id="fDesc" maxlength="400" placeholder="Детали, ссылки, сроки…"></textarea>
    <label for="fAuthor">Кто вешает</label>
    <input id="fAuthor" maxlength="30" placeholder="Твоё имя" autocomplete="off">
    <label>Цвет листочка</label>
    <div class="colors" id="fColors"></div>
    <div class="err" id="fErr"></div>
    <div class="row">
      <button type="button" class="secondary" data-close>Отмена</button>
      <button type="submit" class="primary">Повесить</button>
    </div>
  </form>
</div>

<div class="overlay" id="confOv">
  <div class="dialog">
    <h2>Снять задачу?</h2>
    <div id="confText" style="font-size:15px;line-height:1.4"></div>
    <div class="row">
      <button type="button" class="secondary" data-close>Оставить</button>
      <button type="button" class="danger" id="confYes">Снять</button>
    </div>
  </div>
</div>

<div class="overlay" id="takeOv">
  <form class="dialog" id="takeForm">
    <h2>Взять задачу</h2>
    <label for="tName">Твоё имя</label>
    <input id="tName" maxlength="30" autocomplete="off">
    <div class="err" id="tErr"></div>
    <div class="row">
      <button type="button" class="secondary" data-close>Отмена</button>
      <button type="submit" class="primary">Беру</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var API="/api/notes";
  var COLORS={yellow:"#fff27a",pink:"#ffb3c8",blue:"#a9dcff",green:"#b9f0a4",orange:"#ffcc85"};
  var notes=[], filter="all", pending=null, busy=false, loaded=false;
  var $=function(id){return document.getElementById(id)};

  function lsGet(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show")},3000)}
  function fmt(ts){return new Date(ts).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}
  function rot(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))|0;return ((Math.abs(h)%7)-3)*0.8}

  function api(method,body){
    return fetch(API,{method:method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"})
      .then(function(r){return r.json().catch(function(){return {}}).then(function(d){if(!r.ok)throw new Error(d.error||"Ошибка");return d})});
  }

  function load(silent){
    return api("GET").then(function(d){
      var changed=JSON.stringify(d.notes)!==JSON.stringify(notes);
      notes=d.notes||[];loaded=true;
      if(changed||!silent)render();
      $("status").textContent="Обновлено "+new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
    }).catch(function(){
      if(!loaded){$("count").textContent="Нет связи с сервером";$("board").innerHTML='<div class="empty">Не удалось загрузить доску 😕</div>'}
      $("status").textContent="Нет связи…";
    });
  }

  function render(){
    var n=notes.length, free=notes.filter(function(x){return !x.takenBy}).length;
    $("count").textContent=n?("Задач: "+n+" · свободных: "+free):"Доска пока пустая";
    var fs=[["all","Все"],["free","Свободные"],["taken","В работе"]];
    $("filters").innerHTML=fs.map(function(f){return '<button class="chip'+(filter===f[0]?' on':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>'}).join("");
    var list=notes.filter(function(x){return filter==="all"||(filter==="free"?!x.takenBy:!!x.takenBy)});
    if(!list.length){$("board").innerHTML='<div class="empty">'+(n?"Тут ничего нет":"Повесьте первую задачу ✍️")+'</div>';return}
    $("board").innerHTML=list.map(function(x){
      return '<article class="note c-'+esc(x.color)+'" style="transform:rotate('+rot(x.id)+'deg)">'+
        '<div class="title">'+esc(x.title)+'</div><div class="desc">'+esc(x.desc||"")+'</div>'+
        (x.takenBy?'<div><span class="taken">🙋 Делает: '+esc(x.takenBy)+'</span></div>':'')+
        '<div class="meta">Повесил(а) <span class="who">'+esc(x.author||"аноним")+'</span> · '+fmt(x.created)+'</div>'+
        '<div class="actions">'+
          (x.takenBy?'<button data-act="free" data-id="'+esc(x.id)+'">Освободить</button>':'<button data-act="take" data-id="'+esc(x.id)+'">Беру!</button>')+
          '<button class="rm" data-act="rm" data-id="'+esc(x.id)+'">Снять ✕</button>'+
        '</div></article>'}).join("");
  }

  function run(method,body,okMsg){
    if(busy)return Promise.resolve();
    busy=true;
    return api(method,body).then(function(){if(okMsg)toast(okMsg);return load()})
      .catch(function(e){toast(e.message||"Не получилось, попробуй ещё раз");return load()})
      .then(function(){busy=false});
  }

  function open(id){$(id).classList.add("open")}
  function close(id){$(id).classList.remove("open")}
  document.querySelectorAll(".overlay").forEach(function(o){
    o.addEventListener("click",function(e){if(e.target===o||e.target.hasAttribute("data-close"))close(o.id)});
  });
  document.addEventListener("keydown",function(e){if(e.key==="Escape")document.querySelectorAll(".overlay.open").forEach(function(o){close(o.id)})});

  var selColor="yellow";
  function drawColors(){$("fColors").innerHTML=Object.keys(COLORS).map(function(k){
    return '<button type="button" aria-label="'+k+'" data-c="'+k+'" class="'+(k===selColor?'sel':'')+'" style="background:'+COLORS[k]+'"></button>'}).join("")}
  $("fColors").addEventListener("click",function(e){var c=e.target.getAttribute("data-c");if(c){selColor=c;drawColors()}});
  function openAdd(){
    $("fTitle").value="";$("fDesc").value="";$("fAuthor").value=lsGet("board-name");$("fErr").textContent="";
    var ks=Object.keys(COLORS);selColor=ks[Math.floor(Math.random()*ks.length)];drawColors();
    open("addOv");setTimeout(function(){$("fTitle").focus()},60);
  }
  $("addBtn").addEventListener("click",openAdd);
  $("fab").addEventListener("click",openAdd);
  $("addForm").addEventListener("submit",function(e){
    e.preventDefault();
    var t=$("fTitle").value.trim(),a=$("fAuthor").value.trim();
    if(!t){$("fErr").textContent="Напиши, что нужно сделать";return}
    if(a)lsSet("board-name",a);
    close("addOv");
    run("POST",{title:t,desc:$("fDesc").value.trim(),author:a,color:selColor},"Задача на доске 📌");
  });

  $("filters").addEventListener("click",function(e){var f=e.target.getAttribute("data-f");if(f){filter=f;render()}});
  $("board").addEventListener("click",function(e){
    var b=e.target.closest("button[data-act]");if(!b)return;
    var id=b.getAttribute("data-id"),act=b.getAttribute("data-act");
    var note=notes.find(function(x){return x.id===id});if(!note)return;
    pending=id;
    if(act==="rm"){$("confText").textContent="«"+note.title+"» исчезнет с доски у всех.";open("confOv")}
    else if(act==="take"){$("tName").value=lsGet("board-name");$("tErr").textContent="";open("takeOv");setTimeout(function(){$("tName").focus()},60)}
    else if(act==="free"){run("PATCH",{id:id,takenBy:""},"Задача снова свободна")}
  });
  $("confYes").addEventListener("click",function(){close("confOv");run("DELETE",{id:pending},"Задача снята")});
  $("takeForm").addEventListener("submit",function(e){
    e.preventDefault();var name=$("tName").value.trim();
    if(!name){$("tErr").textContent="Напиши имя";return}
    lsSet("board-name",name);close("takeOv");
    run("PATCH",{id:pending,takenBy:name},"Задача твоя 💪");
  });

  load();
  // Подтягиваем изменения друзей каждые 5 секунд, пока вкладка открыта
  setInterval(function(){if(!document.hidden&&!busy)load(true)},5000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)load(true)});
})();
</script>
</body>
</html>
